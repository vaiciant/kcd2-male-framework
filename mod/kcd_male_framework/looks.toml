# KCD2 Male Framework: the looks. Each one is a face of the game with the parts it starts with. The id never changes: saved
# lives keep it. tools/generate_models.py adds the faces of the game that fit, with the next ids, and never touches an
# entry that is already here, so it can be edited by hand. Everything in this file is a man's look.
#
#   id         Number of the look, shared by both frameworks.
#   name       Short name for the console. A face with no name of its own keeps its internal name.
#   head       Head of the game.
#   ethnicity  czech, hungarian or romani. Empty for a named character's face.
#   age        young or old, from the table of the game.
#   villager   true for a generic face of common people, false for a named character's.
#   body       Body of the game.
#   hair       Hair of the game it starts with.
#   beard      Beard of the game it starts with.
#   soul, token  GUIDs of its preview model and its token. They never change.

